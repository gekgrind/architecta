name: Process website analysis jobs

# Durable backstop for background onboarding website analysis: retries due
# jobs and recovers stale claims (the first attempt runs right after the
# onboarding request). Configure two repo secrets:
#   CRON_WEBSITE_ANALYSIS_URL  e.g. https://architecta.entrepreneuria.io/api/cron/website-analysis
#   CRON_SECRET                must match the deployed CRON_SECRET env var
on:
  schedule:
    - cron: "*/5 * * * *" # every 5 minutes
  workflow_dispatch: {} # allow manual runs from the Actions tab

concurrency:
  group: website-analysis-cron
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger website analysis worker
        env:
          ANALYSIS_URL: ${{ secrets.CRON_WEBSITE_ANALYSIS_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$ANALYSIS_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "CRON_WEBSITE_ANALYSIS_URL and CRON_SECRET repo secrets must be set." >&2
            exit 1
          fi
          curl -fsS -X POST "$ANALYSIS_URL" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            --max-time 290
